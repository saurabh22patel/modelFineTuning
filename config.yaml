# Dataset Configuration
dataset:
  name: "teknium/OpenHermes-2.5"  # Dataset name for logging
  batch_size_per_device: 10  # Optimized for GPU utilization (was 6, now 8)
  gradient_accumulation_steps: 3  # Reduced to improve GPU utilization (was 64, now 8 - too high causes idle time)
  max_length: 2048  # Doubled to increase compute per batch and better utilize GPU (was 1024, now 2048)
  path: "/home/data/datasets/2048/200k"  # UPDATE THIS to your actual dataset path (currently using 200k dataset with 97 samples)

# Model Configuration
model:
  name: "meta-llama/Llama-3.2-1B-Instruct"  # Model name for logging
  path: "/mnt/data/models/1b"  # UPDATE THIS to your actual model path or HF repo ID
  use_flash_attention: false # ENABLED - reduces memory and allows larger batches (CRITICAL for performance)
  gradient_checkpointing: true  # Enable gradient checkpointing for memory efficiency
  hf_token: "hf_"  # HuggingFace token for gated models (or set via HF_TOKEN env var)

training:
  num_epochs: 3
  learning_rate: 2.0e-5
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  save_steps: 999999  # Disable intermediate checkpoints for small test runs (code will skip anyway for < 500 samples)
  eval_steps: 200
  logging_steps: 10
  output_dir: "/mnt/data/models/checkpoints/20M"
  save_total_limit: 3
  evaluate_before_training: false  # Set to true only if you have enough memory (can cause OOM)
  skip_fsdp_verification: true
  save_safetensors: true  # Use safetensors for faster checkpoint saving (enabled by default)
  save_only_model: true  # Faster checkpoint saves (only model, not optimizer) 
   
 # FSDP Configuration for distributed training
fsdp:
  sharding_strategy: "FULL_SHARD"  # Shard model across all GPUs for optimal NVLink utilization
  cpu_offload: false  # DISABLED - keep model on GPU to enable NVLink communication
  mixed_precision: true  # Use bfloat16 for memory efficiency
  use_orig_params: true  # Required for FSDP with transformers
  limit_all_gathers: true  # ENABLED - reduces memory spikes and improves stability
  state_dict_type: "SHARDED_STATE_DICT"  # Use sharded state dict to save memory during checkpointing
  backward_prefetch: "BACKWARD_PRE"  # Prefetch parameters before backward pass
  # forward_prefetch: NOT SUPPORTED - causes parsing errors in transformers/accelerate FSDP config
  param_init_fn: null  # Use default parameter initialization

# MLflow Configuration
mlflow:
  tracking_uri: null  # Set via MLFLOW_TRACKING_URI environment variable or here (e.g., "http://your-mlflow-server:5000")
  username: null  # Set via MLFLOW_USERNAME environment variable or here
  password: null  # Set via MLFLOW_PASSWORD environment variable or here (not recommended for security)
  experiment_name: "llm_fine_tuning"
  log_model: true
  log_artifacts: true
  # For remote MLflow, use format: "http://username:password@mlflow-server:5000" or set username/password separately

# Performance optimization
performance:
  dataloader_num_workers: 8 # Optimized - too many workers (36) causes overhead and context switching (now 4)
  pin_memory: true  # ENABLED - faster CPU to GPU transfers
  prefetch_factor: 16  # Optimized - too high (30) causes memory overhead (now 2)
  persistent_workers: true  # ENABLED - avoid worker restart overhead
  use_cpu_offload: false  # DISABLED - keep optimizer states on GPU for NVLink communication
  activation_checkpointing: true  # Already enabled via model.gradient_checkpointing
  dataloader_timeout: 60  # Timeout to prevent worker hangs
  # Memory optimization options
  use_8bit_optimizer: false  # Use 8-bit optimizers to reduce optimizer memory by ~50%
  activation_offloading: false  # DISABLED - keep activations on GPU for NVLink communication
  gradient_checkpointing_every_n_layers: 4  # More aggressive checkpointing to save memory and allow larger batches
  max_memory_mb: 78000  # Increased to use more of available 80GB (leaves 2GB buffer)
  clear_cache_frequency: 50  # Less frequent cache clearing (was 20, now 50) - reduces overhead
  sync_module_states: false  # DISABLED by default - can cause deadlock during FSDP init if ranks don't sync properly