# Environment Configuration
environment:
  venv_path: "~/llmtune/bin/activate"  # Path to virtual environment activation script
  # Options:
  #   - "~/llmtune/bin/activate" for shared cluster venv
  #   - "./venv/bin/activate" for project-local venv
  #   - Leave empty or null to use automatic detection

# Training Configuration
model:
  name: "meta-llama/Llama-3.1-70B-Instruct"  # Change to your model
  path: "/mnt/data/models"  # Local path after download
  use_flash_attention: true
  gradient_checkpointing: true
  hf_token: null  # Set via HF_TOKEN environment variable or here (not recommended for security)

dataset:
  name: "wikitext"  # Change to your dataset
  path: "/root/data/dataset"  # Local path after download (pre-tokenized)
  max_length: 2048
  batch_size_per_device: 4  # Adjust based on GPU memory
  gradient_accumulation_steps: 8  # Effective batch size = batch_size_per_device * num_gpus * gradient_accumulation_steps

training:
  num_epochs: 3
  learning_rate: 2.0e-5
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  save_steps: 500
  eval_steps: 500
  logging_steps: 10
  output_dir: "/mnt/data/models/checkpoints"
  save_total_limit: 3

# FSDP Configuration for distributed training
fsdp:
  sharding_strategy: "FULL_SHARD"  # Options: FULL_SHARD, SHARD_GRAD_OP, NO_SHARD
  cpu_offload: false
  mixed_precision: true
  use_orig_params: true
  limit_all_gathers: true

# MLflow Configuration
mlflow:
  tracking_uri: null  # Set via MLFLOW_TRACKING_URI environment variable or here (e.g., "http://your-mlflow-server:5000")
  username: null  # Set via MLFLOW_USERNAME environment variable or here
  password: null  # Set via MLFLOW_PASSWORD environment variable or here (not recommended for security)
  experiment_name: "llm_fine_tuning"
  log_model: true
  log_artifacts: true
  # For remote MLflow, use format: "http://username:password@mlflow-server:5000" or set username/password separately

# Performance optimization
performance:
  dataloader_num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  use_cpu_offload: false
  activation_checkpointing: true

